openapi: 3.1.0
info:
  title: Claude History Dashboard — server API
  version: 0.1.0
  summary: HTTP contract for the dashboard's live `/api/*` surface (the SERVER build only).
  description: |
    Machine-readable contract for the endpoints served by `scripts/server.mjs`,
    the dashboard's live backend. It computes every data route on the fly from the
    host's `~/.claude` tree; the SQLite ingest cache and the `src/lib/parse-*.ts`
    parsers own the response shapes (see `REFERENCES.md`). This document is
    **descriptive of current behavior**, generated by reading the route handlers —
    it does not redesign or version the surface (that is follow-up work).

    ## Server-only surface (SPA/server split, #324/#325)

    Every path here belongs to the **server** deployment. The upload-only SPA build
    (`vite build --mode spa`) aliases `src/lib/api-client.ts` to a no-op stub, so
    the SPA bundle contains **none** of these URL literals and makes **zero**
    `/api/*` calls — it works entirely from a user-uploaded export. Do not assume
    any route below exists in the SPA build. `src/lib/api-client.ts` is the
    de-facto client boundary that owns each literal; this spec is the formal
    version of that module.

    ## Auth model (default: none)

    The default deployment binds loopback for a single local user and requires
    **no auth** for reads. Three optional gates layer on top:

    - **CSRF token** (`X-CSRF-Token`, always required for the mutating routes):
      the SPA bootstraps a per-process token from `GET /api/csrf-token` and replays
      it on every write. Writes also require a same-origin browser `Origin` and
      `application/json`.
    - **HTTP Basic Auth** (`DASHBOARD_USER` + `DASHBOARD_PASS`): when set, gates
      every sensitive surface — used when the host port is bound beyond loopback.
    - **Enterprise auth** (`Bearer` token or session cookie, only when
      `DASHBOARD_ORG_ID`/JWT config is present): role- and scope-based
      authorization over the `/api/*` surface and the raw feeds.

    Because these gates are off by default, operations carry `security` requirements
    only where a gate is unconditional (the CSRF-protected writes). Basic and
    enterprise auth are described here but not attached per-operation since they are
    deployment-conditional.
  license:
    name: See repository LICENSE
    url: https://github.com/shpwrck/claude-history-dashboard/blob/master/LICENSE
  contact:
    name: claude-history-dashboard
    url: https://github.com/shpwrck/claude-history-dashboard
servers:
  - url: http://127.0.0.1:5173
    description: Default local server (loopback). `HOST`/`PORT` are configurable; pasta networking is IPv4-only, so prefer `127.0.0.1` over `localhost`.
# Default deployment is single-user loopback with NO auth. Operations that
# override this (the CSRF-protected writes) declare their own `security`.
security: []
tags:
  - name: core-data
    description: Read-only aggregated data feeds the dashboard views consume.
  - name: recommendations
    description: The recommendation engine feed and its adoption/telemetry/reject signals.
  - name: session-detail
    description: Lazy per-session detail (timeline, tools, transcript) and raw source-scoped blobs.
  - name: mutations
    description: Mutating local routes. All require the per-process CSRF token.
  - name: provisioning
    description: RemoteSession provisioning CRUD (#1251). Writes require the CSRF token.
  - name: ingest
    description: Push-ingest of session artifacts from a remote shipper (#1563).
  - name: enterprise
    description: Enterprise auth/session and org rollups. Enforced only when enterprise auth is configured.
  - name: raw-feeds
    description: Root-level (non-`/api`) live data feeds that mirror the on-disk `~/.claude` layout.
  - name: ops
    description: Operational endpoints (health check).
paths:
  /healthz:
    get:
      tags: [ops]
      operationId: getHealthz
      summary: Liveness probe.
      description: Returns `ok` as plain text. Also accepts `HEAD`.
      responses:
        '200':
          description: Server is up.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/csrf-token:
    get:
      tags: [mutations]
      operationId: getCsrfToken
      summary: Bootstrap the per-process CSRF token.
      description: |
        Same-origin GET the SPA reads on first load; the value is replayed as an
        `X-CSRF-Token` (or `Bearer`) header on every mutating route. A cross-origin
        page can issue this fetch but the browser's same-origin policy prevents it
        reading the JSON body, so it cannot learn the token to forge a write.
        Served `Cache-Control: no-store`.
      responses:
        '200':
          description: The active per-process token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/policy/write:
    post:
      tags: [mutations]
      operationId: writePolicy
      summary: Append a permissions diff to the global `~/.claude/settings.json`.
      description: |
        Mutating route (#199). Validates the payload, writes a timestamped backup,
        then appends and dedupes the permission entries into
        `~/.claude/settings.json`. Requires the CSRF token, a same-origin `Origin`,
        and `application/json`.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyWriteRequest'
      responses:
        '200':
          description: Write applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyWriteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        default:
          $ref: '#/components/responses/Error'

  /api/adoption/receipts:
    get:
      tags: [recommendations]
      operationId: readAdoptionReceipts
      summary: Read the append-only recs adoption receipt log.
      description: |
        Read-only replay of the `SURFACED`/`SUPPRESSED` receipts the Adoption
        Scorecard joins (#575/#577). Each line is re-sanitized through the same
        allowlist as the writer, so no field outside the allowlist can surface.
        Empty array when the store does not exist.
      responses:
        '200':
          description: The sanitized receipts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptionReceiptsResponse'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [mutations, recommendations]
      operationId: appendAdoptionReceipt
      summary: Append one recs adoption receipt.
      description: |
        Mutating writer (#575). Same auth gate as `/api/policy/write` (CSRF +
        same-origin). The core writer drops every non-allowlisted field before
        appending to the dashboard-owned data dir.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: One adoption receipt. Non-allowlisted fields are dropped by the writer. See `src/lib/adoption-receipts.ts`.
              additionalProperties: true
      responses:
        '200':
          description: Receipt appended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        default:
          $ref: '#/components/responses/Error'

  /api/recommendations/reject:
    post:
      tags: [mutations, recommendations]
      operationId: postRejectSignal
      summary: Record that the user rejected a recommendation.
      description: |
        Append-only reject-signal writer (#1294). Same mutating-route auth gate as
        the adoption writer; the core writer keeps only `{findingId, reason}`.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectSignalRequest'
      responses:
        '200':
          description: Reject signal recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        default:
          $ref: '#/components/responses/Error'

  /api/steer-telemetry:
    get:
      tags: [recommendations]
      operationId: readSteerTelemetry
      summary: Per-rule PreToolUse-steer telemetry rollup.
      description: |
        Read-only rollup of the existing PreToolUse-steer delivery/outcome log
        (#2203): fire-count, followed/ignored, misfire tags. A missing/empty log is
        an empty array.
      responses:
        '200':
          description: The per-rule records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SteerTelemetryResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/Error'

  /api/dataset.json:
    get:
      tags: [core-data]
      operationId: getDataset
      summary: The full normalized dataset payload.
      description: |
        One pre-aggregated payload the dashboard consumes (entries, token data,
        tool data, timelines, API errors, permissions, agent settings, runtime
        events, and the server-only `#539` artifact keys). Stat-gated + ETag
        revalidated (`X-Source: live`, brotli/gzip negotiated); a matching
        `If-None-Match` yields `304`. The response shape is the assembled dataset —
        see `assembleDataset()` in `scripts/ingest.mjs` and the parser table in
        `REFERENCES.md`.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The dataset.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Source:
              $ref: '#/components/headers/XSource'
            X-Ingest:
              schema:
                type: string
              description: Ingest bookkeeping for external verification (skipped/stale/cached counts).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '304':
          $ref: '#/components/responses/NotModified'

  /api/dataset/boot:
    get:
      tags: [core-data]
      operationId: getDatasetBoot
      summary: The tiny boot half of the split dataset (#2443).
      description: |
        Metadata + aggregates + per-slice counts so the client paints the landing
        shell without the full monolith; heavy detail arrives lazily via
        `/api/dataset/slice/{key}`. Same stat-gated cache + ETag revalidation as
        `/api/dataset.json`. Also accepts `HEAD`.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The boot payload.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Dataset-Version:
              schema:
                type: string
              description: Dataset split version.
          content:
            application/json:
              schema:
                type: object
                description: Boot metadata, aggregates, and per-slice counts (see `buildBootPayload` in `scripts/server.mjs`).
                additionalProperties: true
        '304':
          $ref: '#/components/responses/NotModified'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/dataset/slice/{key}:
    get:
      tags: [core-data]
      operationId: getDatasetSlice
      summary: One heavy per-view dataset array (#2443).
      description: |
        Fetched only when its view opens. `key` must be a known sliceable key;
        anything else is `404`, so the surface is a fixed allowlist, not arbitrary
        dataset access. Same ETag revalidation as the boot route. Also accepts `HEAD`.
      parameters:
        - name: key
          in: path
          required: true
          description: A known sliceable dataset key (e.g. `entries`, `tokenData`). See `isSliceKey` in `scripts/server.mjs`.
          schema:
            type: string
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The slice array.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                description: The requested dataset slice (shape depends on the key). See the parser table in `REFERENCES.md`.
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/recommendations.json:
    get:
      tags: [recommendations]
      operationId: getRecommendations
      summary: The recommendation engine feed.
      description: |
        Server-side mirror of the UI Recommendations view (#126): the same pure
        `buildRecommendations` engine over the same assembled dataset, so headless /
        agent consumers get byte-identical recs (stable `id`s and `fix` snippets)
        without a browser. ETag revalidated; a matching `If-None-Match` yields `304`.
      parameters:
        - name: project
          in: query
          required: false
          description: '`?project=<path>` narrows recs to that project; absent → the global list.'
          schema:
            type: string
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The recommendations payload.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Source:
              $ref: '#/components/headers/XSource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
        '304':
          $ref: '#/components/responses/NotModified'

  /api/digest:
    get:
      tags: [core-data]
      operationId: getDigest
      summary: The server-projected daily digest for one local date.
      parameters:
        - name: date
          in: query
          required: false
          description: Target date `YYYY-MM-DD`. Defaults to the server-local today.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: The daily digest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyDigest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/search:
    get:
      tags: [core-data]
      operationId: search
      summary: Hybrid lexical/semantic search over prompt history.
      parameters:
        - name: q
          in: query
          required: false
          description: The query string. An empty/whitespace query returns an empty result set at `200`.
          schema:
            type: string
        - name: project
          in: query
          required: false
          description: Optional project filter.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Max results (bounded 1–100, default 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HybridSearchResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/memories:
    get:
      tags: [core-data]
      operationId: getMemories
      summary: Per-project agent memories (raw markdown).
      description: |
        Walks the fixed-depth memory surface at
        `<scoped-root>/projects/<slug>/memory/*.md` plus direct
        `memory/archive/*.md` files (never nested archive directories). Returns
        RAW markdown with canonical memory-root-relative names, grouped by
        project slug and read fresh per request. Per-project `readCompleteness`
        reports whether fact, main-index, and archive-index absence claims are
        safe after bounded skips. The client parser
        (`src/lib/parse-memories.ts`) owns frontmatter and index parsing.
      responses:
        '200':
          description: The memories, grouped by project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoriesResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/workflows:
    get:
      tags: [core-data]
      operationId: getWorkflows
      summary: The Workflow-tool run ledger.
      description: |
        Walks every authorized projects root's
        `<slug>/<sessionId>/workflows/wf_*.json` manifest, projects it to the
        ledger fields, and returns runs newest-first (#435, #2713). Local and
        enterprise-admin requests include the configured local/hub root set;
        enterprise non-admin requests are confined to their assigned data root.
        Run and discovery caps apply across the aggregate root set. Post-hoc
        ledger, not a live monitor. `src/lib/parse-workflows.ts` normalizes the
        shape.
      responses:
        '200':
          description: The workflow runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowsResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/usage:
    get:
      tags: [core-data]
      operationId: getUsage
      summary: Live plan-usage snapshot for the Budget Gauge.
      description: |
        Server-side OAuth read of the live plan-limit rate-limit headers (#130).
        Degrades to `{ available: false, reason }` and never throws.
      responses:
        '200':
          description: The usage snapshot (available or degraded).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'

  /api/live:
    get:
      tags: [core-data]
      operationId: getLive
      summary: The in-flight live session snapshot.
      description: |
        Reads the active transcript directly off disk (#131), bypassing the ingest
        cache (which lags an in-flight session by design). Returns `{ active: false }`
        when nothing has an event newer than ~15 min. Served `no-store`.
      responses:
        '200':
          description: The live-session payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveSession'

  /api/audit.json:
    get:
      tags: [recommendations]
      operationId: getAudit
      summary: Opt-in tier-3 LLM judge-audit findings (server-only).
      description: |
        Opt-in tier-3 judge/audit harness (#605/#738), gated by ADR 0008 (registered
        call site, Console API key, egress scrub, cost cap). Unless explicitly
        enabled — with `ANTHROPIC_API_KEY`, `DASHBOARD_ENABLE_SERVER_LLM_AUDITS`, and
        a transmission-grade egress scrub — it returns `{ status: 'skipped', reason }`
        at `200`. On any compute error it returns `{ status: 'failed' }` at `200`,
        NEVER `500`. Never called on dataset load.
      responses:
        '200':
          description: The audit result (ran, skipped, or failed) — always `200`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRunResponse'

  /api/experiments.json:
    get:
      tags: [recommendations]
      operationId: getExperiments
      summary: Experiment-axis evaluator (server-only, #2242).
      description: |
        Joins the live enrollment ledger (arm per session) to the measured
        conversational-availability metric and qualifies each axis. Fails open to
        `{ axes: [] }` when the ledger is absent.
      responses:
        '200':
          description: Per-axis verdicts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  axes:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                additionalProperties: true
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/shadow-experiments.json:
    get:
      tags: [recommendations]
      operationId: getShadowExperiments
      summary: Shadow-calls per-experiment drill-down feed (#2152).
      description: |
        Fresh tail-capped ledger read per request, newest-first pagination, every
        bound surfaced. When local #2702 C5 state exists, the response also carries
        an optional bounded projection of fully re-verified sealed evidence. Raw
        prompts, transcripts, diffs, process output, and artifact bodies are never
        projected. Trial-directory overflow fails closed and is surfaced in
        reconciliation rather than returning an arbitrary partial history.
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size (bounded 1–2000, default 500).
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
        - name: offset
          in: query
          required: false
          description: Newest-first offset (default 0).
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: The paginated shadow-experiment rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShadowExperimentsResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/session/{sessionId}/timeline.json:
    get:
      tags: [session-detail]
      operationId: getSessionTimeline
      summary: One session's FULL timeline (#1035/#1285).
      description: |
        The bulk dataset ships slim timelines (`summary` stripped); this endpoint
        returns the session's full timeline straight from its `session_blob` row.
        ETag is the row's `content_hash` with a `-timeline` suffix. The `.json`
        suffix is optional (`/api/session/{sessionId}/timeline` also resolves).
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The full timeline.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTimeline'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/session/{sessionId}/tools.json:
    get:
      tags: [session-detail]
      operationId: getSessionTools
      summary: One session's FULL tool calls, including Bash `input.command` (#1287).
      description: |
        The bulk dataset ships Bash calls with raw `input.command` stripped; this
        endpoint returns the full tool row on demand. Same freshness/ETag model as
        the timeline detail route. The `.json` suffix is optional.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The full tool-usage data.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolUsageData'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/transcript/{sessionId}:
    get:
      tags: [session-detail]
      operationId: getTranscriptContent
      summary: Stored assistant transcript content blocks (#205).
      description: |
        Returns the session's stored assistant content blocks from the compressed
        `session_blob` row (materialized on demand). ETag is the row's `content_hash`;
        brotli is streamed as-is for `br` clients.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The transcript content blocks.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/transcript/{sessionId}/thinking:
    get:
      tags: [session-detail]
      operationId: getTranscriptThinking
      summary: Stored thinking blocks for a session.
      description: ETag is the row's `content_hash` with a `-thinking` suffix so a 304 can't cross-match the content route.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The thinking blocks.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sources/{sourceId}/sessions/{project}/{file}:
    get:
      tags: [session-detail]
      operationId: getSourceSessionJsonl
      summary: Raw source-scoped session JSONL (with merged subagents).
      description: |
        Source-scoped alias of `GET /projects/{slug}/{file}.jsonl` — the raw merged
        session transcript (parent + `subagents/*.jsonl` + nested workflow agent
        transcripts). Returns `text/plain` JSONL. `404` when the source or file is
        absent.
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - name: project
          in: path
          required: true
          description: Project slug.
          schema:
            type: string
        - name: file
          in: path
          required: true
          description: Session file name (e.g. `<sessionId>.jsonl`).
          schema:
            type: string
      responses:
        '200':
          description: The raw merged session JSONL.
          content:
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sources/{sourceId}/history.jsonl:
    get:
      tags: [session-detail, raw-feeds]
      operationId: getSourceHistoryJsonl
      summary: Raw source-scoped `history.jsonl`.
      description: Source-scoped alias of `GET /history.jsonl`. Returns `text/plain` JSONL; `404` when absent.
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: The raw history JSONL.
          content:
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sessions:
    get:
      tags: [provisioning]
      operationId: listRemoteSessions
      summary: List dispatched RemoteSession pools (#1251).
      description: 'A down/absent backend resolves to `{ ok: false, configured: false, sessions: [] }`.'
      responses:
        '200':
          description: The RemoteSession list result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteSessionsResult'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    post:
      tags: [provisioning, mutations]
      operationId: createRemoteSession
      summary: Provision a RemoteSession pool.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRemoteSessionInput'
      responses:
        '200':
          description: The provision result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRemoteSessionResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        default:
          $ref: '#/components/responses/Error'

  /api/sessions/{name}:
    delete:
      tags: [provisioning, mutations]
      operationId: deleteRemoteSession
      summary: Delete a RemoteSession pool by name.
      security:
        - csrfToken: []
      parameters:
        - name: name
          in: path
          required: true
          description: The RemoteSession name.
          schema:
            type: string
      responses:
        '200':
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        default:
          $ref: '#/components/responses/Error'

  /api/ingest/{sourceId}/artifacts:
    post:
      tags: [ingest]
      operationId: ingestArtifacts
      summary: Push-ingest session artifacts from a remote shipper (#1563).
      description: |
        Accepts a batch of session-data artifacts (optionally gzip-encoded) and
        writes them into the shared ingest tree. Only artifacts the tree classifier
        admits as `session-data` are written (config + secret paths are refused,
        ADR 0009). Idempotent per artifact `signature`. Requires ingest auth
        (`passesIngestAuth`); returns `503` when ingest is not configured.
      security:
        - ingestBearer: []
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - name: Content-Encoding
          in: header
          required: false
          description: Set to `gzip` when the body is gzip-compressed.
          schema:
            type: string
            enum: [gzip]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestArtifactsRequest'
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: 'gzip-compressed JSON body (when `Content-Encoding: gzip`).'
      responses:
        '200':
          description: Ingest result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestArtifactsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          description: Ingest not configured on this dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/session:
    get:
      tags: [enterprise]
      operationId: getAuthSession
      summary: Current enterprise auth session.
      description: |
        Reports the auth mode/principal. In the default single-user deployment
        returns a `single-user` session with `authRequired: false`. Enforced shapes
        appear only when enterprise auth is configured.
      responses:
        '200':
          description: The auth session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseSession'
    post:
      tags: [enterprise]
      operationId: createAuthSession
      summary: Establish a browser session from a Bearer token.
      security:
        - enterpriseBearer: []
      responses:
        '200':
          description: The established session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseSession'
    delete:
      tags: [enterprise]
      operationId: clearAuthSession
      summary: Clear the browser session.
      responses:
        '204':
          description: Session cleared.

  /api/enterprise/audit-log:
    get:
      tags: [enterprise]
      operationId: getEnterpriseAuditLog
      summary: Enterprise auth audit-event log (privileged).
      description: Enforced only when enterprise auth is on; requires an admin principal.
      responses:
        '200':
          description: Audit events.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/enterprise/audit-export.ndjson:
    get:
      tags: [enterprise]
      operationId: exportEnterpriseAudit
      summary: Enterprise audit export as NDJSON (privileged).
      parameters:
        - name: limit
          in: query
          required: false
          description: Max events to export.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: NDJSON audit export (one JSON event per line).
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/enterprise/organization:
    get:
      tags: [enterprise]
      operationId: getEnterpriseOrganization
      summary: Organization summary (principals, teams, rollup) — privileged.
      parameters:
        - name: principalLimit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: principalOffset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: The organization summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseOrganizationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/enterprise/readiness-receipt:
    get:
      tags: [enterprise]
      operationId: getEnterpriseReadinessReceipt
      summary: Enterprise readiness receipt (privileged).
      responses:
        '200':
          description: The readiness receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseReadinessReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/organization/rollup.json:
    get:
      tags: [enterprise]
      operationId: getEnterpriseOrganizationRollup
      summary: Aggregate organization rollup (privileged).
      responses:
        '200':
          description: The organization rollup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseOrganizationRollup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sessions-manifest.json:
    get:
      tags: [raw-feeds]
      operationId: getSessionsManifest
      summary: Live list of session files (root feed).
      description: |
        Root-level (non-`/api`) live manifest of session files, mirroring the
        on-disk layout. Bounded by `X-Dashboard-Manifest-Limit`; `X-Dashboard-Manifest-Truncated`
        signals truncation. Served `no-store`.
      responses:
        '200':
          description: The manifest entries.
          headers:
            X-Dashboard-Manifest-Limit:
              schema:
                type: string
              description: The manifest entry cap.
            X-Dashboard-Manifest-Returned:
              schema:
                type: string
              description: Number of entries returned.
            X-Dashboard-Manifest-Truncated:
              schema:
                type: string
              description: Present and `true` when the manifest was truncated.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

  /history.jsonl:
    get:
      tags: [raw-feeds]
      operationId: getHistoryJsonl
      summary: Raw `~/.claude/history.jsonl` (root feed).
      description: The default-source flat prompt-history JSONL. Returns `text/plain`; `404` when absent.
      responses:
        '200':
          description: The raw history JSONL.
          content:
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{slug}/{file}:
    get:
      tags: [raw-feeds]
      operationId: getProjectSessionJsonl
      summary: Raw session JSONL with merged subagents (root feed).
      description: |
        The default-source raw merged session transcript (parent +
        `subagents/*.jsonl` + nested workflow agent transcripts). Returns
        `text/plain` JSONL; `404` when absent.
      parameters:
        - name: slug
          in: path
          required: true
          description: Project slug.
          schema:
            type: string
        - name: file
          in: path
          required: true
          description: Session file name (e.g. `<sessionId>.jsonl`).
          schema:
            type: string
      responses:
        '200':
          description: The raw merged session JSONL.
          content:
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Per-process token from `GET /api/csrf-token`, replayed on every mutating
        route (may also be sent as `Authorization: Bearer <token>`). Writes also
        require a same-origin browser `Origin` and `application/json`.
    enterpriseBearer:
      type: http
      scheme: bearer
      description: Enterprise Bearer token (only when enterprise auth is configured). A session cookie is an accepted alternative.
    ingestBearer:
      type: http
      scheme: bearer
      description: |
        Shared push-ingest Bearer token (`Authorization: Bearer <token>`), verified
        by `passesIngestAuth` on `POST /api/ingest/{sourceId}/artifacts` (#1563).
        Deliberately distinct from `csrfToken`: cross-origin shippers present this
        dedicated credential rather than a same-origin CSRF token, and a failed or
        missing token yields `401`.
    basicAuth:
      type: http
      scheme: basic
      description: Optional HTTP Basic Auth gate (`DASHBOARD_USER` + `DASHBOARD_PASS`) that, when set, protects every sensitive surface.

  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Conditional revalidation against the resource ETag; a match yields `304`.
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      description: The session id.
      schema:
        type: string
    SourceId:
      name: sourceId
      in: path
      required: true
      description: The coding-agent source id (e.g. `claude-code`).
      schema:
        type: string

  headers:
    ETag:
      description: Content-hash ETag for conditional revalidation.
      schema:
        type: string
    XSource:
      description: Always `live` for computed data routes.
      schema:
        type: string

  responses:
    NotModified:
      description: Not modified — the cached body matching `If-None-Match` is current.
    NotFound:
      description: Not found — no such artifact/row. Body is empty for the raw/detail routes.
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not allowed (failed CSRF/same-origin or enterprise authorization).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: Method not allowed for this route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Request body exceeded the configured cap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      description: Standard error envelope for `/api/*` failures.
      properties:
        ok:
          const: false
        error:
          type: string
      required: [ok, error]
    OkResponse:
      type: object
      properties:
        ok:
          const: true
      required: [ok]
    CsrfTokenResponse:
      type: object
      properties:
        token:
          type: string
      required: [token]
    PolicyWriteRequest:
      type: object
      description: |
        A permissions diff to append. Validated by `validatePolicyInput`; see
        `src/lib/policy-writer.ts`. Typically `{ permissions: { allow?, ask?, deny? } }`
        with string-rule arrays.
      additionalProperties: true
    PolicyWriteResponse:
      type: object
      properties:
        ok:
          const: true
        file:
          type: string
          description: Absolute path written (`~/.claude/settings.json`).
        backup:
          type: [string, 'null']
          description: Path of the timestamped backup, or null.
        added:
          type: array
          description: The rules actually appended (after dedupe).
          items:
            type: string
        addedCount:
          type: integer
      required: [ok]
    RejectSignalRequest:
      type: object
      properties:
        findingId:
          type: string
        reason:
          type: string
          description: 'One of: `dismiss` | `wrong` | `not-relevant`. See `src/lib/reject-reason.ts`.'
      required: [findingId, reason]
    AdoptionReceiptsResponse:
      type: object
      properties:
        ok:
          const: true
        receipts:
          type: array
          description: Sanitized `SURFACED`/`SUPPRESSED` receipts. See `src/lib/adoption-receipts.ts`.
          items:
            type: object
            additionalProperties: true
      required: [ok, receipts]
    SteerTelemetryResponse:
      type: object
      properties:
        ok:
          const: true
        records:
          type: array
          description: Per-rule steer telemetry. See `src/lib/steer-telemetry-types.ts` (`SteerRuleTelemetry`).
          items:
            type: object
            additionalProperties: true
      required: [ok, records]
    Dataset:
      type: object
      description: |
        The assembled dashboard dataset. Its keys are produced by the
        `src/lib/parse-*.ts` parsers via `assembleDataset()` — see the parser →
        dataset-key table in `REFERENCES.md`. Documented as an open object rather
        than re-deriving the (large, evolving) shape here.
      additionalProperties: true
    RecommendationsResponse:
      type: object
      description: |
        The recommendation feed produced by `buildRecommendations`
        (`src/lib/recommendations.ts`). Consumed by `/recs`. Documented as an open
        object; the per-recommendation shape (`id`, `fix`, `provenance`, …) is owned
        by `src/lib/detectors/types.ts`.
      additionalProperties: true
    DailyDigest:
      type: object
      description: The daily digest (`DailyDigest` in `src/types.ts`).
      properties:
        schemaVersion:
          const: '1'
        date:
          type: string
        timeZone:
          type: string
        generatedAt:
          type: string
        total:
          type: object
          additionalProperties: true
        projects:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [schemaVersion, date, generatedAt, total, projects]
    HybridSearchResponse:
      type: object
      description: '`HybridSearchResponse` in `src/lib/hybrid-search.ts`.'
      properties:
        mode:
          type: string
          description: The search mode (e.g. `hybrid`).
        semanticAvailable:
          type: boolean
        results:
          type: array
          items:
            $ref: '#/components/schemas/HybridSearchResult'
      required: [mode, semanticAvailable, results]
    HybridSearchResult:
      type: object
      properties:
        entry:
          type: object
          description: A `HistoryEntry`.
          additionalProperties: true
        score:
          type: number
        lexicalScore:
          type: number
        semanticScore:
          type: number
        matchType:
          type: string
        snippet:
          type: string
      required: [entry, score, lexicalScore, semanticScore, matchType, snippet]
    MemoriesResponse:
      type: object
      description: '`MemoriesResponse` in `src/lib/parse-memories.ts`.'
      properties:
        projects:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              files:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Memory-root-relative path, including `archive/<file>.md`.
                    content:
                      type: string
                    mtimeMs:
                      type: number
                  required: [name, content]
              readCompleteness:
                type: object
                properties:
                  facts:
                    type: boolean
                  mainIndex:
                    type: boolean
                  archiveIndex:
                    type: boolean
                required: [facts, mainIndex, archiveIndex]
            required: [slug, files, readCompleteness]
            additionalProperties: true
      required: [projects]
    WorkflowsResponse:
      type: object
      description: '`WorkflowsResponse` in `src/lib/parse-workflows.ts`.'
      properties:
        runs:
          type: array
          items:
            type: object
            additionalProperties: true
        limits:
          type: object
          properties:
            manifestMaxBytes:
              type: integer
            maxRuns:
              type: integer
            maxDiscoveryEntries:
              type: integer
            maxPhasesPerRun:
              type: integer
            maxProgressEntriesPerRun:
              type: integer
            fieldMaxChars:
              type: integer
          required:
            - manifestMaxBytes
            - maxRuns
            - maxDiscoveryEntries
            - maxPhasesPerRun
            - maxProgressEntriesPerRun
            - fieldMaxChars
        discovery:
          type: object
          properties:
            entriesExamined:
              type: integer
            directoriesOpened:
              type: integer
          required: [entriesExamined, directoriesOpened]
        skippedManifests:
          type: integer
        truncated:
          type: boolean
          description: True when run or discovery bounds may have omitted manifests.
      required: [runs, limits, discovery, skippedManifests, truncated]
    Usage:
      description: '`Usage` in `src/lib/usage.ts` — available or degraded.'
      oneOf:
        - $ref: '#/components/schemas/UsageAvailable'
        - $ref: '#/components/schemas/UsageUnavailable'
    UsageAvailable:
      type: object
      properties:
        available:
          const: true
        fiveHour:
          oneOf:
            - $ref: '#/components/schemas/UsageWindow'
            - type: 'null'
        sevenDay:
          oneOf:
            - $ref: '#/components/schemas/UsageWindow'
            - type: 'null'
        overage:
          oneOf:
            - $ref: '#/components/schemas/UsageOverage'
            - type: 'null'
        representativeClaim:
          type: [string, 'null']
      required: [available]
    UsageUnavailable:
      type: object
      properties:
        available:
          const: false
        reason:
          type: string
          description: '`not-logged-in` | `auth-failed` | `no-headers` | `fetch-failed` | `client-error`.'
      required: [available, reason]
    UsageWindow:
      type: object
      properties:
        utilization:
          type: number
          description: 0–1 fraction of the window consumed.
        reset:
          type: [integer, 'null']
          description: Unix seconds at which the window resets.
        status:
          type: [string, 'null']
      required: [utilization, reset, status]
    UsageOverage:
      type: object
      properties:
        inUse:
          const: true
        utilization:
          type: [number, 'null']
      required: [inUse, utilization]
    LiveSession:
      type: object
      description: |
        The in-flight live session. `{ active: false }` when nothing is live; the
        active shape carries the current session snapshot. See `computeLiveSession`
        in the ingest API.
      properties:
        active:
          type: boolean
      required: [active]
      additionalProperties: true
    AuditRunResponse:
      type: object
      description: 'Tier-3 audit result. `AuditRunResponse` in `src/lib/api-client.ts`.'
      properties:
        status:
          type: string
          enum: [ran, skipped, failed]
        reason:
          type: string
        disabled:
          type: boolean
        findings:
          type: array
          items:
            type: object
            description: An `AuditFinding` (`src/lib/audit/types.ts`).
            additionalProperties: true
      required: [status, findings]
    ShadowExperimentsResponse:
      type: object
      properties:
        total:
          type: integer
        counted:
          type: integer
        synthetic:
          type: integer
        skipped:
          type: integer
        ledgerTruncated:
          type: boolean
        rowsDropped:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        returned:
          type: integer
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        gate2702:
          $ref: '#/components/schemas/Gate2702Projection'
      required: [total, offset, limit, returned, rows]
    Gate2702Projection:
      type: object
      description: Bounded, redacted projection of locally verified #2702 C5 evidence.
      properties:
        total:
          type: integer
          minimum: 0
        returned:
          type: integer
          minimum: 0
          maximum: 500
        dropped:
          type: integer
          minimum: 0
        rows:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Gate2702RunProjection'
        evaluationTotal:
          type: integer
          minimum: 0
        evaluationReturned:
          type: integer
          minimum: 0
          maximum: 100
        evaluationsDropped:
          type: integer
          minimum: 0
        evaluations:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Gate2702EvaluationProjection'
        reconciliation:
          $ref: '#/components/schemas/Gate2702Reconciliation'
      required:
        - total
        - returned
        - dropped
        - rows
        - evaluationTotal
        - evaluationReturned
        - evaluationsDropped
        - evaluations
        - reconciliation
      additionalProperties: false
    Gate2702Reconciliation:
      type: object
      properties:
        scanned:
          type: integer
          minimum: 0
        validated:
          type: integer
          minimum: 0
        unsealed:
          type: integer
          minimum: 0
        malformed:
          type: integer
          minimum: 0
        discoveryOverflow:
          type: integer
          minimum: 0
          description: State roots rejected because trial discovery exceeded its fixed bound.
      required: [scanned, validated, unsealed, malformed, discoveryOverflow]
      additionalProperties: false
    Gate2702RunProjection:
      type: object
      properties:
        rowId:
          type: string
        trialId:
          type: string
          format: uuid
        runId:
          type: [string, 'null']
          format: uuid
        subject:
          type: integer
          enum: [2760, 2719, 2713, 2706, 2710, 2670]
        treatmentId:
          type: string
          enum: [haiku-solo, haiku-sonnet-sidekick]
        attempt:
          type: integer
          enum: [1, 2]
        finishedAt:
          type: [string, 'null']
          format: date-time
        terminalClassification:
          type: string
          enum:
            [
              succeeded,
              check-failed,
              tooling-invalid,
              cancelled,
              cost-unknown,
              failed,
              excluded,
            ]
        objectiveChecks:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/Gate2702ObjectiveCheck'
        judgeState:
          type: string
          enum:
            - quality-held
            - quality-loss
            - exhausted
            - unavailable
            - not-evaluable
            - subject-sealed-result
            - not-available-in-run-summary
            - not-evaluated
        wallTimeMs:
          type: [number, 'null']
          minimum: 0
        allInCostUsd:
          type: [number, 'null']
          minimum: 0
        sidekick:
          type: object
          properties:
            triggerCount:
              type: [integer, 'null']
              minimum: 0
            paidCallCount:
              type: [integer, 'null']
              minimum: 0
            shippedInterventionCount:
              type: [integer, 'null']
              minimum: 0
          required: [triggerCount, paidCallCount, shippedInterventionCount]
          additionalProperties: false
        exclusionReason:
          type: [string, 'null']
          maxLength: 256
      required:
        - rowId
        - trialId
        - runId
        - subject
        - treatmentId
        - attempt
        - finishedAt
        - terminalClassification
        - objectiveChecks
        - judgeState
        - wallTimeMs
        - allInCostUsd
        - sidekick
        - exclusionReason
      additionalProperties: false
    Gate2702ObjectiveCheck:
      type: object
      properties:
        checkId:
          type: string
          enum: [checks/gate-2702-typecheck, checks/gate-2702-vitest]
        outcome:
          type: string
          enum: [passed, failed]
      required: [checkId, outcome]
      additionalProperties: false
    Gate2702EvaluationProjection:
      type: object
      properties:
        trialId:
          type: string
          format: uuid
        evaluatedAt:
          type: string
          format: date-time
        outcome:
          $ref: '#/components/schemas/Gate2702EvaluationOutcome'
        decision:
          type: string
          enum:
            [
              sidekick-clears,
              sidekick-does-not-clear,
              inconclusive,
              invalid,
              insufficient-evidence,
            ]
        sampleCounts:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            properties:
              treatmentId:
                type: string
                enum: [haiku-solo, haiku-sonnet-sidekick]
              n:
                type: integer
                minimum: 0
            required: [treatmentId, n]
            additionalProperties: false
        gates:
          type: array
          maxItems: 4
          items:
            type: object
            properties:
              gateId:
                type: string
                enum:
                  [
                    parityFloor,
                    netPositiveCost,
                    attributableShips,
                    minimumSample,
                  ]
              state:
                type: string
                enum: [passed, failed, not-evaluable]
            required: [gateId, state]
            additionalProperties: false
        includedRunCount:
          type: integer
          minimum: 0
        excludedRunCount:
          type: integer
          minimum: 0
          description: Canonical Runs excluded by the evaluation.
        preRunExclusionCount:
          type: integer
          minimum: 0
          description: Candidates excluded before a canonical Run was produced.
        exclusionCounts:
          type: array
          items:
            type: object
            properties:
              reason:
                type: string
                maxLength: 256
              count:
                type: integer
                minimum: 1
            required: [reason, count]
            additionalProperties: false
      required:
        - trialId
        - evaluatedAt
        - outcome
        - decision
        - sampleCounts
        - gates
        - includedRunCount
        - excludedRunCount
        - preRunExclusionCount
        - exclusionCounts
      additionalProperties: false
    Gate2702EvaluationOutcome:
      oneOf:
        - type: object
          properties:
            kind:
              const: winner
            winningTreatmentId:
              type: string
              enum: [haiku-solo, haiku-sonnet-sidekick]
          required: [kind, winningTreatmentId]
          additionalProperties: false
        - type: object
          properties:
            kind:
              const: tie
          required: [kind]
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              enum: [inconclusive, invalid, insufficient-evidence]
            reason:
              type: string
              maxLength: 256
          required: [kind, reason]
          additionalProperties: false
